defaults:
  - dsrl_can
  - _self_

name: robomimic_can_dsrl_transformer_${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}

# Evaluated at 0.125 success on Can with 200 finished episodes.
base_policy_path: ./dppo/log/robomimic-pretrain/can_pre_diffusion_transformer_ta4_td20_emb128/2026-07-13_09-44-28_42/checkpoint/state_60.pt

model:
  _target_: model.diffusion.diffusion_eval.DiffusionEval
  ft_denoising_steps: 0
  predict_epsilon: True
  denoised_clip_value: 1.0
  randn_clip_value: 3
  network_path: ${base_policy_path}
  network:
    _target_: model.diffusion.transformer_diffusion.DiffusionTransformer
    action_dim: ${action_dim}
    horizon_steps: ${act_steps}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    n_layer: 4
    n_head: 4
    n_emb: 128
    p_drop_emb: 0.0
    p_drop_attn: 0.1
    causal_attn: True
    n_cond_layers: 0
  horizon_steps: ${act_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: 20
  device: ${device}
  use_ddim: True
  ddim_steps: 10
  controllable_noise: True
