defaults:
  - dsrl_can_transformer
  - _self_

name: robomimic_can_dlsrl_transformer_v4_${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}

# Keep the same 7-D, Ta=4 Transformer base policy as the no-adapter baseline.
base_policy_path: ./dppo/log/robomimic-pretrain/can_pre_diffusion_transformer_ta4_td20_emb128/2026-07-13_09-44-28_42/checkpoint/state_60.pt

# Measure sample efficiency before the full-noise DSRL policy saturates Can.
total_timesteps: 400000
run_initial_eval: True
eval_interval: 150
# CheckpointCallback counts vector calls; 1000 calls = 50k transitions for 50 envs.
save_model_interval: 1000

adapter:
  enabled: True
  # One state-dependent adapter residual is shared across the four action tokens.
  latent_steps: 1
  noise_steps: 4
  noise_magnitude: 1.0
  log_std_init: 0.0
  control_log_std_init: -2.0
  entropy_noise_only: True
  control_dim: 16
  gate_dim: 1
  feature_dim: 128
  hidden_dim: 128
  # Preserve a near-base initialization while allowing control/gate gradients
  # to reach the adapter from the first enabled update.
  feature_init_std: 1e-3
  feature_scale: 0.25
  gate_max: 0.2
  gate_logit_scale: 5.0
  gate_logit_bias: -2.5
  # A moderate physical residual; critic_effect_scale only normalizes critic features.
  injection_scale: 3e-2
  critic_effect_scale: 100.0
  l2_coef: 1e-2
  gate_l1_coef: 2e-2
  # Keep codes away from tanh/sigmoid saturation without suppressing learning.
  control_l2_coef: 1e-2
  gate_code_l2_coef: 5e-2
  warmup_steps: 5000
  ramp_steps: 25000
  gradient_scale: 1.0
